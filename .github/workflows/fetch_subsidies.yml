name: Update subsidies.json

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 1 * *" # 1. eines jeden Monats um 03:00 UTC

concurrency:
  group: energyplanning-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate unverified research proposal
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python scripts/fetch_subsidies.py --proposal-output "$RUNNER_TEMP/subsidy-proposal.json"

      - name: Ensure published data is unchanged
        run: git diff --exit-code -- data/subsidies.json data/data.json sitemap.xml

      - name: Retain proposal for manual source review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: unverified-subsidy-proposal
          path: ${{ runner.temp }}/subsidy-proposal.json
          retention-days: 30
