name: EnergyPlanning Auto Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force:
        description: Upload all productive files again
        type: boolean
        default: false
  workflow_run:
    workflows: ["Update subsidies.json"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: energyplanning-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout latest main after acquiring production lock
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Checkout pinned shared FTPS transport
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ckvfox/realitycheck
          ref: caabbb5e906d3e3a60efa6139a65190569597e34
          path: .deployment-tools
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/deploy_ftps.py
            /scripts/prepare_deployment.py

      - name: Set up Python
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: '3.11'

      - name: Install pinned dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt -r requirements-dev.txt

      - name: Install pinned DOM test dependencies
        run: npm ci --ignore-scripts

      - name: Test exact production snapshot
        run: |
          python -m ruff check scripts/
          python scripts/modernisierung_tests.py
          python scripts/check_calculation_docs.py
          python -m unittest discover -s scripts -p "test_*.py"
          npm test
          python -c "import json; from pathlib import Path; [json.loads(Path(p).read_text(encoding='utf-8')) for p in ['data/data.json','data/subsidies.json']]"
          python .github/scripts/fpf_project_compliance.py . --profile apache-shared-hosting --production

      - name: Prepare minified productive package
        id: package
        run: |
          python scripts/build_deployment.py --full-only
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Test actual minified production payload
        env:
          ENERGY_TEST_ROOT: ${{ github.workspace }}/builds/full-deployment
        run: node --test scripts/test_frontend.cjs

      - name: Check required deployment settings
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          python - <<'PY'
          import os
          missing = [name for name in ('FTP_SERVER', 'FTP_USERNAME', 'FTP_PASSWORD') if not os.environ.get(name)]
          if missing:
              raise SystemExit('Missing GitHub repository secrets: ' + ', '.join(missing))
          print('All required deployment settings are present; values are not displayed.')
          PY

      - name: Upload changed productive files (FTPS, no deletes)
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          DEPLOY_COMMIT: ${{ steps.package.outputs.commit }}
          FORCE_UPLOAD: ${{ inputs.force == true && 'true' || 'false' }}
        run: |
          args=()
          if [ "$FORCE_UPLOAD" = "true" ]; then args+=(--force); fi
          python scripts/deploy_site.py --commit "$DEPLOY_COMMIT" "${args[@]}"

      - name: Record deployment result
        if: always()
        env:
          DEPLOY_STATUS: ${{ job.status }}
          DEPLOY_COMMIT: ${{ steps.package.outputs.commit }}
        run: |
          {
            echo "### EnergyPlanning FTPS deployment"
            echo "Status: $DEPLOY_STATUS"
            echo "Tested commit: $DEPLOY_COMMIT"
            echo "Destination: /energyplanning.great-site.net/htdocs"
            echo "No remote files are deleted."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Save secret-free deployment receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: energyplanning-ftps-${{ github.run_id }}
          path: builds/auto-deploy-receipt.json
          if-no-files-found: ignore
          retention-days: 30
