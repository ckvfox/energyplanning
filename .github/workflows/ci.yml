name: CI – Lint & Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  python-lint:
    name: Python – Ruff Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff openai>=1.30.0 python-dotenv>=1.0.0 httpx>=0.27.0

      - name: Lint with Ruff
        run: ruff check scripts/

  python-tests:
    name: Python – Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openai>=1.30.0 python-dotenv>=1.0.0 httpx>=0.27.0

      - name: Run Python tests
        run: python scripts/modernisierung_tests.py

  validate-json:
    name: JSON – Schema-Validierung
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate data.json
        run: python -c "import json; json.load(open('data/data.json'))"

      - name: Validate subsidies.json
        run: python -c "import json; json.load(open('data/subsidies.json'))"
